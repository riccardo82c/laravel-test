services:
  app:
    build: .
    working_dir: /var/www/html
    user: "1000:1000"
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    environment:
      HOME: /tmp
    command: bash -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
